name: Bird2048
options:
  bundleIdPrefix: com.guoxinling
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Bird2048:
    type: application
    platform: iOS
    sources:
      - path: Bird2048
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guoxinling.bird2048
        INFOPLIST_FILE: Bird2048/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - Bird2048Tests
  Bird2048Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Bird2048Tests
    dependencies:
      - target: Bird2048
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guoxinling.bird2048.tests
        INFOPLIST_FILE: Bird2048Tests/Info.plist
